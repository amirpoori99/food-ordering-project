# TestFX Configuration for Headless Testing
testfx.robot=awt
testfx.headless=true
testfx.robot.write_sleep=100
testfx.robot.read_sleep=100
testfx.robot.auto_wait=1000
testfx.robot.auto_wait_for_idle=true

# JavaFX Headless Settings
monocle.platform=Headless
prism.order=sw
javafx.verbose=false
javafx.animation.fullspeed=true
javafx.animation.pulse=1

# System Settings
java.awt.headless=true
file.encoding=UTF-8

# Memory Settings
-Xmx2g
-XX:+UseG1GC 